# Baseline TLS hostnames for the example-managed egress policy.
# To replace it, copy this file into your deployment directory, edit the list,
# and set firewall_config_path to your copy's path.
allowed_domains:
  # Ona's fallback devcontainer (no devcontainer.json): MCR image manifests.
  # Keep access for cache misses even when the runner VM image preloads the base.
  - mcr.microsoft.com
  # MCR image layers are delivered from regional data endpoints.
  - .data.mcr.microsoft.com

  # The fallback adds no package-install commands or Dev Container Features.
  # Custom images, features, dotfiles, and setup commands may need extra hosts.

  # Linear: read and publish issues through its GraphQL API.
  - api.linear.app

  # GitHub: clone repositories over HTTPS and push changes.
  - github.com
  # GitHub API: read repository metadata and manage issues and pull requests.
  - api.github.com
  # GitHub archives: download repository source archives.
  - codeload.github.com
  # GitHub content: retrieve raw source files and release assets.
  - .githubusercontent.com

  # Jira Cloud: read and publish issues through the OAuth API gateway.
  # Direct site APIs and self-hosted Jira need explicit additional hostnames.
  - api.atlassian.com

  # OpenAI: direct model requests using a bring-your-own API key.
  - api.openai.com
