name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish Terraform module release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.8"

      - name: Verify release tag
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${RELEASE_TAG}^{commit}" origin/main
          bash scripts/validate-release.sh "$RELEASE_TAG"

      - name: Validate Terraform module
        run: |
          terraform fmt -check -recursive
          bash scripts/check-parity-contract.sh
          terraform init -backend=false
          terraform validate
          terraform test

          terraform -chdir=modules/custom-domain-client-infra init -backend=false
          terraform -chdir=modules/custom-domain-client-infra validate
          terraform -chdir=modules/custom-domain-client-infra test

          for example_dir in examples/*/; do
            if [[ -f "${example_dir}/main.tf" ]]; then
              terraform -chdir="$example_dir" init -backend=false
              terraform -chdir="$example_dir" validate
            fi
          done

          git diff --exit-code

      - name: Build release notes
        run: bash scripts/build-release-notes.sh "$RELEASE_TAG" release-body.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file release-body.md
