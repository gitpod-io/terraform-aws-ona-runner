name: Update stable runner release

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-stable-runner-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: "1.15.8"

      - name: Update stable release
        id: release
        run: |
          version="$(bash scripts/update-stable-release.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate update
        if: steps.changes.outputs.changed == 'true'
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
          terraform test

      - name: Open update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          branch="automation/runner-release-${VERSION}"
          existing_pr="$(gh pr list --state open --head "$branch" --json url --jq '.[0].url // empty')"
          if [[ -n "$existing_pr" ]]; then
            echo "An update pull request already exists: $existing_pr"
            exit 0
          fi

          git config user.name "gitpod-next-automation"
          git config user.email "gitpod-next-automation@gitpod.io"
          git switch -c "$branch"
          git add variables.tf
          git commit -m "chore: update stable runner release to ${VERSION}"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: update stable runner release to ${VERSION}" \
            --body "Updates the default AWS runner release from the published stable manifest."
