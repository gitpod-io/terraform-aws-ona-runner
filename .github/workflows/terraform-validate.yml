name: Terraform Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.8"

      - name: Validate release tooling
        run: |
          release_tag="v$(tr -d '[:space:]' < VERSION)"
          release_notes="$(mktemp)"
          trap 'rm -f "$release_notes"' EXIT

          shellcheck scripts/*.sh
          bash scripts/test-release-tools.sh
          bash scripts/validate-release.sh "$release_tag"
          bash scripts/build-release-notes.sh "$release_tag" "$release_notes" HEAD
          test -s "$release_notes"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Check Fargate parity contract
        run: bash scripts/check-parity-contract.sh

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Test
        run: terraform test

      - name: Validate custom domain helper
        run: |
          terraform -chdir=modules/custom-domain-client-infra init -backend=false
          terraform -chdir=modules/custom-domain-client-infra validate
          terraform -chdir=modules/custom-domain-client-infra test

      - name: Validate Examples
        run: |
          for example_dir in examples/*/; do
            if [ -d "$example_dir" ] && [ -f "$example_dir/main.tf" ]; then
              echo "Validating example: $example_dir"
              cd "$example_dir"
              terraform init -backend=false
              terraform validate
              cd - > /dev/null
            fi
          done
