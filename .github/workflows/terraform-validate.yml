name: Terraform Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  terraform-validate:
    name: Terraform Validate (AWS ${{ matrix.aws-provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        aws-provider: ["5.100.0", "6.0.0", "6.60.0"]

    steps:
      - name: Checkout code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          # The uploader test passes an expression to terraform console via stdin.
          terraform_wrapper: false

      - name: Validate release tooling
        run: |
          release_tag="v$(tr -d '[:space:]' < VERSION)"
          release_notes="$(mktemp)"
          trap 'rm -f "$release_notes"' EXIT

          shellcheck scripts/*.sh
          bash scripts/test-release-tools.sh
          bash scripts/validate-release.sh "$release_tag"
          bash scripts/build-release-notes.sh "$release_tag" "$release_notes" HEAD
          test -s "$release_notes"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Check Fargate parity contract
        run: bash scripts/check-parity-contract.sh

      - name: Test AWS provider compatibility
        env:
          AWS_PROVIDER_VERSION: ${{ matrix.aws-provider }}
        run: bash scripts/test-aws-provider.sh "$AWS_PROVIDER_VERSION"

  terraform-validate-result:
    name: Terraform Validate
    if: ${{ always() }}
    needs: terraform-validate
    runs-on: ubuntu-latest
    steps:
      - name: Require every provider version to pass
        env:
          MATRIX_RESULT: ${{ needs.terraform-validate.result }}
        run: test "$MATRIX_RESULT" = success
